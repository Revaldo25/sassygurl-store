<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" fill="none">
  <rect width="200" height="80" rx="12" fill="#FFFFFF"/>
  <rect x="1" y="1" width="198" height="78" rx="11" stroke="#E5E7EB" stroke-width="1"/>
  <!-- Retail: Indomaret Red #E31937, Alfamart Red #ED1C24 -->
  <g transform="translate(18, 12)">
    <!-- Store/shop icon -->
    <rect width="52" height="56" rx="12" fill="#E31937"/>
    <!-- Store roof -->
    <path d="M6 22L26 8l20 14H6z" fill="#FFFFFF" opacity="0.9"/>
    <!-- Store body -->
    <rect x="14" y="24" width="24" height="20" rx="2" fill="#FFFFFF" opacity="0.85"/>
    <!-- Door -->
    <rect x="21" y="30" width="10" height="14" rx="1.5" fill="#E31937"/>
    <!-- Window -->
    <rect x="16" y="26" width="6" height="6" rx="1" fill="#E31937" opacity="0.6"/>
    <rect x="30" y="26" width="6" height="6" rx="1" fill="#E31937" opacity="0.6"/>
  </g>
  <!-- Retail Text -->
  <text x="82" y="30" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="12" fill="#E31937" letter-spacing="0.5">Indomaret</text>
  <text x="82" y="47" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="12" fill="#ED1C24" letter-spacing="0.5">Alfamart</text>
  <text x="82" y="62" font-family="Arial, sans-serif" font-weight="600" font-size="9" fill="#6B7280">Bayar di Toko</text>
</svg>