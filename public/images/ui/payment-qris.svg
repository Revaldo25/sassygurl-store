<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" fill="none">
  <rect width="200" height="80" rx="12" fill="#FFFFFF"/>
  <rect x="1" y="1" width="198" height="78" rx="11" stroke="#E5E7EB" stroke-width="1"/>
  <!-- QRIS Official Colors: Red #ED1C24, Blue #004B87 -->
  <g transform="translate(20, 14)">
    <!-- QR Code icon -->
    <rect x="0" y="4" width="44" height="44" rx="6" fill="#004B87"/>
    <rect x="4" y="8" width="14" height="14" rx="2" fill="#FFFFFF"/>
    <rect x="6" y="10" width="10" height="10" rx="1" fill="#004B87"/>
    <rect x="26" y="8" width="14" height="14" rx="2" fill="#FFFFFF"/>
    <rect x="28" y="10" width="10" height="10" rx="1" fill="#004B87"/>
    <rect x="4" y="30" width="14" height="14" rx="2" fill="#FFFFFF"/>
    <rect x="6" y="32" width="10" height="10" rx="1" fill="#004B87"/>
    <rect x="22" y="24" width="4" height="4" fill="#FFFFFF"/>
    <rect x="28" y="28" width="4" height="4" fill="#FFFFFF"/>
    <rect x="34" y="34" width="4" height="4" fill="#FFFFFF"/>
    <rect x="26" y="38" width="4" height="4" fill="#FFFFFF"/>
    <rect x="34" y="24" width="4" height="4" fill="#FFFFFF"/>
  </g>
  <!-- QRIS Text -->
  <text x="80" y="36" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="26" fill="#004B87" letter-spacing="1.5">QRIS</text>
  <text x="80" y="55" font-family="Arial, sans-serif" font-weight="600" font-size="10" fill="#ED1C24" letter-spacing="0.5">Quick Response</text>
  <text x="80" y="66" font-family="Arial, sans-serif" font-weight="600" font-size="10" fill="#ED1C24" letter-spacing="0.5">Indonesia Standard</text>
</svg>