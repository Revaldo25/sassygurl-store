name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  # ── BACKEND: Build + Test ──────────────────────────────────────────────────
  backend-build-test:
    name: "Backend — Build & Test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore backend
        run: dotnet restore backend/SassyGurl.Api/SassyGurl.Api.csproj

      - name: Build backend
        run: dotnet build backend/SassyGurl.Api/SassyGurl.Api.csproj --no-restore -c Release

      - name: Run backend tests
        run: dotnet test backend/SassyGurl.Api.Tests/SassyGurl.Api.Tests.csproj -c Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: "**/*.trx"

  # ── FRONTEND: Build + Lint ─────────────────────────────────────────────────
  frontend-build-lint:
    name: "Frontend — Build & Lint"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (Next.js)
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:5000/api"
          NEXTAUTH_URL: "http://localhost:3000"
          NEXTAUTH_SECRET: "ci-test-secret-not-used-in-production"
          NEXT_PUBLIC_MIDTRANS_CLIENT_KEY: "ci-placeholder"
        run: npm run build

  # ── DOCKER: Build Test ─────────────────────────────────────────────────────
  docker-build-test:
    name: "Docker — Backend Image Build"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t sassygurl-api:ci-test ./backend

      - name: Verify health check config
        run: |
          HAS_HEALTHCHECK=$(docker inspect sassygurl-api:ci-test --format='{{.Config.Healthcheck}}')
          if [ -z "$HAS_HEALTHCHECK" ] || [ "$HAS_HEALTHCHECK" = "<nil>" ]; then
            echo "ERROR: Docker image has no HEALTHCHECK defined"
            exit 1
          fi
          echo "Healthcheck: $HAS_HEALTHCHECK"

  # ── POLICY GATES ──────────────────────────────────────────────────────────
  policy-gates:
    name: "Policy Gates"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Gate 1: Larang direct fetch ke internal Next.js API route ──────────
      - name: "Gate: Larang fetch('/api/...') dari app/"
        run: |
          if git grep -rn "fetch('/api/" -- 'app/**/*.ts' 'app/**/*.tsx'; then
            echo ""
            echo "❌ GAGAL: Ditemukan fetch('/api/...') di app/."
            echo "   Gunakan Server Action atau fetchApi() dari lib/api-client.ts"
            exit 1
          fi
          echo "✅ Tidak ada legacy fetch('/api/...') ditemukan"

      # ── Gate 2: Larang fetch langsung ke backend dari client component ──────
      - name: "Gate: Larang fetch NEXT_PUBLIC_API_URL dari client component"
        run: |
          if git grep -rn "fetch(\`\${process.env.NEXT_PUBLIC_API_URL}" -- 'app/**/*.tsx' 'app/**/*.ts'; then
            echo ""
            echo "❌ GAGAL: Ditemukan fetch() langsung ke backend dari client component."
            echo "   Pindahkan ke Server Action yang menggunakan fetchApi() dari lib/api-client.ts"
            exit 1
          fi
          echo "✅ Tidak ada direct client-side fetch ke backend ditemukan"

      # ── Gate 3: Larang hardcoded credentials di appsettings ────────────────
      - name: "Gate: Tidak ada credentials nyata di appsettings"
        run: |
          # Cek DB password di appsettings.json (bukan Development)
          if git grep -n 'Password=' -- 'backend/SassyGurl.Api/appsettings.json'; then
            echo "❌ GAGAL: Hardcoded DB password di appsettings.json"
            exit 1
          fi
          # Cek API key Midtrans (sandbox atau production)
          if git grep -rn 'SB-Mid-server\|Mid-server-' -- 'backend/'; then
            echo "❌ GAGAL: Midtrans Server Key ter-commit!"
            exit 1
          fi
          # Cek API key Xendit
          if git grep -rn 'xnd_development_\|xnd_production_' -- 'backend/'; then
            echo "❌ GAGAL: Xendit API Key ter-commit!"
            exit 1
          fi
          # Cek JWT key nyata (bukan PLACEHOLDER) di appsettings.Development.json
          if git grep -n '"Key": "[^[]*"' -- 'backend/SassyGurl.Api/appsettings.Development.json' \
             | grep -v 'PLACEHOLDER'; then
            echo "❌ GAGAL: JWT key nyata ter-commit di appsettings.Development.json"
            exit 1
          fi
          echo "✅ Tidak ada credentials nyata yang ter-commit"

      # ── Gate 4: File .env.example wajib ada ────────────────────────────────
      - name: "Gate: .env.example wajib ada"
        run: |
          if [ ! -f ".env.example" ]; then
            echo "❌ GAGAL: .env.example tidak ada di root proyek"
            exit 1
          fi
          if [ ! -f "backend/.env.example" ]; then
            echo "❌ GAGAL: backend/.env.example tidak ada"
            exit 1
          fi
          echo "✅ Kedua file .env.example tersedia"

      # ── Gate 5: vercel.json wajib ada ──────────────────────────────────────
      - name: "Gate: vercel.json wajib ada"
        run: |
          if [ ! -f "vercel.json" ]; then
            echo "❌ GAGAL: vercel.json tidak ada — diperlukan untuk deployment Vercel"
            exit 1
          fi
          echo "✅ vercel.json tersedia"
